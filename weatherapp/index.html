<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-app">
        <h1><i class="fas fa-cloud-sun"></i> Weather App</h1>
        
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Enter city name..." autocomplete="off">
            <button type="submit"><i class="fas fa-search"></i></button>
        </form>
        
        <button id="location-btn"><i class="fas fa-location-dot"></i> Use My Location</button>
        
        <div id="search-history"></div>
        
        <div class="weather-info" id="weather-info" style="display: none;">
            <h2 id="city-name">--</h2>
            <div class="weather-main">
                <i id="weather-icon" class="fas fa-sun"></i>
                <span id="temperature">--°C</span>
            </div>
            <p id="weather-condition">--</p>
            <p id="feels-like">Feels like: --°C</p>
            <div class="weather-details">
                <p id="wind-speed"><i class="fas fa-wind"></i> Wind: -- m/s</p>
                <p id="humidity"><i class="fas fa-droplet"></i> Humidity: --%</p>
            </div>
            <button id="unit-toggle" class="toggle-btn">°C / °F</button>
        </div>
        
        <h3 id="forecast-title" style="display: none;">5-Day Forecast</h3>
        <div id="forecast" class="forecast-container"></div>
        
        <div id="loading" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
        <div id="error" class="error"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
